# BACKGROUND
background {
    monitor =
    path = screenshot  # This takes a live screenshot and blurs it!
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
}

# TIME LABEL
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 0.8)
    font_size = 120
    font_family = JetBrains Mono Nerd Font Bold
    position = 0, 160
    halign = center
    valign = center
}

# DATE LABEL
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B")"
    color = rgba(255, 255, 255, 0.6)
    font_size = 24
    font_family = JetBrains Mono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}

# INPUT FIELD (Password Box)
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.25 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.40 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.1)
    inner_color = rgba(0, 0, 0, 0.5)
    font_color = rgba(255, 255, 255, 0.8)
    fade_on_empty = false
    placeholder_text = <i>Enter Password...</i>
    hide_input = false
    
    # Validation state styling
    fail_color = rgba(243, 139, 168, 1.0) # Soft red if wrong
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    
    position = 0, -60
    halign = center
    valign = center
}
